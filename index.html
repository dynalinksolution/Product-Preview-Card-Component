<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Product Preview Card Component</title>
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" type="text/css" media="all" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="product-card">
            <div class="product-img">
                <img src="images/image-product-desktop.jpg" alt="" class="desk">
            </div>
            <div class="product-details">
               <p>PERFUME</p>
               <h1>Gabrielle Essence Eau De Parfum</h1>
               <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator of the House of CHANEL</p>
               <div class="pricing">
                   <h2>
                       $149.99
                   </h2>
                   <p>$169.99</p>
               </div>
               <button type="submit">
                   <img class="cart" src="images/icon-cart.svg" alt="" />
                   Add to Cart
               </button>
            </div>
        </div>
    </main>
</body>
</html>
